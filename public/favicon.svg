<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tile" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="coin" x1="18" y1="15" x2="46" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.8" flood-color="#064e3b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>

  <!-- coin = money -->
  <g filter="url(#soft)">
    <circle cx="32" cy="32" r="19" fill="url(#coin)" stroke="#d97706" stroke-width="1.2"/>
  </g>
  <!-- subtle top highlight -->
  <path d="M20 25 A15 15 0 0 1 44 22" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- clock ticks = time -->
  <g fill="#0f766e">
    <circle cx="32" cy="18.5" r="1.3"/>
    <circle cx="45.5" cy="32" r="1.3"/>
    <circle cx="32" cy="45.5" r="1.3"/>
    <circle cx="18.5" cy="32" r="1.3"/>
  </g>

  <!-- clock hands merge money + time -->
  <g stroke="#0f766e" stroke-linecap="round" fill="none">
    <path d="M32 32 V22.5" stroke-width="2.6"/>
    <path d="M32 32 L40 35" stroke-width="2.6"/>
  </g>
  <circle cx="32" cy="32" r="2.2" fill="#0f766e"/>
</svg>
