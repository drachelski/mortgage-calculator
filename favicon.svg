<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tile" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="coin" x1="24" y1="34" x2="40" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.6" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>

  <!-- time: progress arc sweeping the top-right, evoking a clock / amortization over time -->
  <path d="M39 11.5 A21 21 0 0 1 52.5 25" stroke="#ffffff" stroke-opacity="0.32"
        stroke-width="2.6" stroke-linecap="round" fill="none"/>

  <!-- house (money + time live inside it) -->
  <g filter="url(#soft)">
    <path d="M32 10 L57 32.5 H7 Z" fill="#ffffff"/>
    <rect x="17" y="30" width="30" height="24.5" rx="3.5" fill="#ffffff"/>
  </g>

  <!-- clock ticks around the coin -->
  <g fill="#4338ca" opacity="0.55">
    <circle cx="32" cy="31.6" r="0.9"/>
    <circle cx="42.4" cy="42" r="0.9"/>
    <circle cx="32" cy="52.4" r="0.9"/>
    <circle cx="21.6" cy="42" r="0.9"/>
  </g>

  <!-- coin doubling as a clock face: money + time -->
  <circle cx="32" cy="42" r="9" fill="url(#coin)" stroke="#d97706" stroke-width="1"/>
  <g stroke="#4338ca" stroke-linecap="round" fill="none">
    <path d="M32 42 V35.6" stroke-width="2"/>
    <path d="M32 42 L36.6 43.6" stroke-width="2"/>
  </g>
  <circle cx="32" cy="42" r="1.5" fill="#4338ca"/>
</svg>
